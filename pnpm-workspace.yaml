  "@fontsource-variable/geist": ^5.3.0
  "@opencode/client": ^2.3.2
  "@oxlint/plugins": ^1.94.0
  "@rolldown/plugin-babel": ^0.3.1
  "@tailwindcss/vite": ^4.3.5
  "@tanstack/react-router": ^1.170.46
  "@tanstack/router-plugin": ^1.169.0
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.13
  "@ui-sdk/core": 0.1.0-beta.16
  "@ui-sdk/react": 0.1.0-beta.16
  "@tiptap/extensions": ^3.35.0
  "@tiptap/core": ^3.35.0
  "@tiptap/pm": ^3.35.0
  "@tiptap/react": ^3.35.0
  "@tiptap/starter-kit": ^3.35.0
  "@types/better-sqlite3": ^9.6.0
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  astro: 7.4.13
  babel-plugin-react-compiler: ^1.0.0
  better-sqlite3: npm:better-sqlite3-multiple-ciphers@13.2.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  date-fns: ^4.4.0
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  electron: ^45.4.1
  electron-builder: 26.18.0
  electron-updater: ^6.8.11
  electron-vite: 6.0.0
  effect: 4.1.5
  husky: ^9.1.7
  imapflow: 2.12.2
  jsdom: ^31.0.1
  lucide-react: ^1.77.0
  motion: ^14.14.0
  nodemailer: 10.6.0
  oxfmt: ^0.79.0
  oxlint: 1.94.0
  oxlint-tsgolint: 7.0.2007
  pdfjs-dist: ^6.5.438
  react: ^19.3.1
  react-dom: ^19.3.1
  sharp: ^0.35.5
  tailwind-merge: ^3.7.1
  tailwindcss: ^4.3.5
  tldts: 7.5.5
  turbo: ^2.11.13
  typescript: 7.0.2
  ultracite: 8.3.1
  vite: ^8.3.8
  vitest: ^5.1.1
  wrangler: ^4.166.0
  zod: ^4.6.7
  zustand: ^5.1.0

catalogs:
  astro:
    typescript: 6.0.3

minimumReleaseAgeExclude:
  - "@effect/*"
  - "@tanstack/*"
  - "@ui-sdk/*"
  - effect
  - "@distilled.cloud/*"
  - "@turbo/*"
  - turbo
  - ultracite
  - "@opencode/client@2.0.8"
  - "@opencode/protocol@2.0.8"
  - "@opencode/schema@2.0.8"
  - "@anthropic-ai/claude-agent-sdk@0.3.276"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.276"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.276"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.276"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.276"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.276"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.276"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.276"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.276"
  - "electron@44.4.2"
  - "wrangler@4.135.0"
  - "miniflare@5.20260918.0-alpha"
  - "workerd@1.20260918.1"
  - "@cloudflare/workerd-darwin-64@1.20260918.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260918.1"
  - "@cloudflare/workerd-linux-64@1.20260918.1"
  - "@cloudflare/workerd-linux-arm64@1.20260918.1"
  - "@cloudflare/workerd-windows-64@1.20260918.1"

# effect-tsgo ships replacements for exact upstream tool versions. Upgrade this
# cohort together only after `effect-tsgo patch` accepts them: @effect/tsgo 0.73.2
# supports oxlint-tsgolint 7.0.2005 through 7.0.2007, not 7.0.2008. See README.
update:
  ignoreDeps:
    - "@effect/tsgo"
    - oxlint
    - oxlint-tsgolint
    - typescript
    - ultracite

# Keep OpenCode schemas and transport on the workspace Effect runtime.
overrides:
  "@opencode/client@2.3.2>effect": "catalog:"
  "@opencode/protocol@2.3.2>effect": "catalog:"
  "@opencode/schema@2.3.2>effect": "catalog:"
