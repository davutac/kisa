  - "@cloudflare/workerd-linux-arm64@1.20260918.1"
  - "@cloudflare/workerd-windows-64@1.20260918.1"

# effect-tsgo ships replacements for exact upstream tool versions. Upgrade this
# cohort together only after the matching artifacts appear in its platform packages.
# Newer Oxlint/Ultracite releases also require a compiler-lint migration; see README.
update:
  ignoreDeps:
    - "@effect/tsgo"
    - oxlint
    - oxlint-tsgolint
    - typescript
    - ultracite

# Keep OpenCode schemas and transport on the workspace Effect runtime.
overrides:
  "@opencode/client@2.1.4>effect": "catalog:"
  "@opencode/protocol@2.1.4>effect": "catalog:"
  "@opencode/schema@2.1.4>effect": "catalog:"
