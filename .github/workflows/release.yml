name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The Apple signing and notarization credentials are environment secrets.
    environment: Prod
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac
            artifact: macos
            signed: true
          - name: Windows
            os: windows-latest
            target: --win
            artifact: windows
            signed: false
          - name: Linux
            os: ubuntu-latest
            target: --linux
            artifact: linux
            signed: false
    env:
      # macOS signs with the Developer ID cert imported from CSC_LINK; the other
      # platforms stay unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.signed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm
          sudo snap install snapcraft --classic

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          MAIN_VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          MAIN_VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: pnpm build

      - name: Build package
        working-directory: apps/desktop
        env:
          # Only exported on macOS: CSC_LINK is shared with the Windows signer,
          # so leaking it into that job would make electron-builder try to sign
          # the installer with the Developer ID certificate.
          CSC_LINK: ${{ matrix.signed && secrets.APPLE_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.signed && secrets.APPLE_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.signed && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.signed && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.signed && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.snap
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest*.yml

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --title "$TAG_NAME" --generate-notes
          fi
