<!doctype html>
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <!-- The Add account window shows only its own form: no remote content,
         no frames, and nothing a form could post to. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>Add account</title>
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/src/account-setup/main.tsx"></script>
  </body>
</html>
